<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Gateway - RRTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-bg">
    <div class="login-container">
        <h2>Secure Terminal Login</h2>
        <form onsubmit="return loginUser()">
            <input type="text" id="username" placeholder="Demo User: Namo" required>
            <input type="password" id="password" placeholder="Demo Pass: 1234" required>
            <button type="submit">Authenticate Session</button>
        </form>
        <div class="form-footer">
            <p><a href="#" style="color: #005bbb; text-decoration: none;">Forgot Password Details?</a></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
