<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Dashboard - Namo Bharat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🚆 Control Hub</div>
        <div class="clock" id="clock">--:--:--</div>
    </header>

    <div class="dashboard-container">
        <div class="banner">
            <h2>Welcome to Namo Bharat</h2>
            <p>The Travelling Future: India's Premium High-Speed Regional Rail Link Infrastructure</p>
        </div>

        <div class="booking-info">
            <h3>Need a Ticket for today's journey?</h3>
            <p style="margin: 10px 0 20px; color: #666;">Fast track scheduling, electronic validations, and immediate seat processing systems are accessible.</p>
            <button class="btn" onclick="window.location.href='ticket.html'">Book Electronic Ticket Now</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="window.location.href='home.html'">🚆 Home</button>
        <button onclick="window.location.href='bookings.html'">💼 Bookings</button>
        <button onclick="window.location.href='ticket.html'">🎟️ Ticket Book</button>
        <button onclick="window.location.href='services.html'">⚙️ Services</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
